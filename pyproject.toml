[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rtrl"
version = "0.1.0"
description = "Frozen-policy rollout selection and GRPO update audits"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gpu = ["vllm==0.29.0", "transformers==5.17.0"]
audit = ["torch>=2.5", "transformers==5.17.0"]
probe = ["numpy>=2"]
test = ["pytest>=8", "torch>=2.5", "numpy>=2", "transformers==5.17.0"]

[project.scripts]
rtrl = "rtrl:main"

[tool.setuptools]
py-modules = ["rtrl", "collect", "local", "diagnose", "records", "replay", "grpo", "rewards", "probe"]

[tool.pytest.ini_options]
testpaths = ["test_rtrl.py", "test_diagnose.py"]
