[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rtrl"
version = "0.1.0"
description = "Single-GPU GRPO training and rollout-selection experiments"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gpu = ["vllm==0.29.0", "transformers==5.17.0"]
audit = ["torch>=2.5", "transformers==5.17.0"]
probe = ["numpy>=2"]
test = ["pytest>=8", "torch>=2.5", "numpy>=2", "transformers==5.17.0"]
training = ["torch==2.11.0", "transformers==5.17.0", "wandb==0.21.4"]
analysis = ["matplotlib==3.11.2", "tensorboard==2.20.0", "setuptools==80.9.0"]

[project.scripts]
rtrl = "rtrl.cli:main"

[tool.setuptools]
packages = ["rtrl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
